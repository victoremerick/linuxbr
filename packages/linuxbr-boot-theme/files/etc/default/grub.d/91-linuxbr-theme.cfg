if [ -f /boot/grub/themes/linuxbr/theme.txt ]; then
# Use the existing bootloader and preserve additional kernel parameters.
GRUB_THEME="/boot/grub/themes/linuxbr/theme.txt"
GRUB_GFXMODE="auto"
GRUB_TIMEOUT_STYLE="menu"
GRUB_TIMEOUT=5
for option in quiet splash loglevel=3 systemd.show_status=false rd.systemd.show_status=false udev.log_level=3 vt.global_cursor_default=0; do
    # Respect explicit administrator choices for the same parameter.
    key=${option%%=*}
    case " ${GRUB_CMDLINE_LINUX_DEFAULT:-} " in
        *" $key "*|*" $key="*) ;;
        *) GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT:+$GRUB_CMDLINE_LINUX_DEFAULT }$option" ;;
    esac
done
unset option key


fi
