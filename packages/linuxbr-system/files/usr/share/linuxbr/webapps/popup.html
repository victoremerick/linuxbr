<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Aplicativos web Linux BR</title>
<link rel="stylesheet" href="popup.css">
<body><header><img src="icon.png" width="32" height="32" alt=""><h1>Aplicativos web</h1></header>
<p id="status">Verificando este site…</p><p id="origin" class="domain"></p>
<button id="install" hidden>Instalar como aplicativo</button>
<button id="ignore" hidden>Não sugerir este site</button>
<p id="result" role="status"></p><hr>
<label><input type="checkbox" id="enabled"> Sugerir aplicativos ao navegar</label>
<p class="small">A identificação ocorre neste computador. Não enviamos seu histórico a um servidor. Não são lidos formulários ou senhas. Janelas anônimas ficam de fora.</p>
<button id="manage">Gerenciar aplicativos instalados</button>
<button id="reset" class="secondary">Permitir novamente os sites ignorados</button>
<script src="popup.js"></script></body></html>
