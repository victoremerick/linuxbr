<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root"><allow own="org.linuxbr.Boot"/></policy>
  <policy context="default">
    <allow send_destination="org.linuxbr.Boot" send_interface="org.linuxbr.Boot" send_member="PrepareRecovery"/>
    <allow send_destination="org.linuxbr.Boot" send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
